<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Phrase Challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;color:#18202a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.card{width:min(92%,520px);padding:38px;background:#fff;border-radius:24px;box-shadow:0 12px 40px #0001;text-align:center}
h1{font-size:31px;margin:0 0 10px}
.sub{color:#66717d;margin-bottom:28px}
input{width:100%;padding:15px;border:1px solid #ccd2d9;border-radius:12px;font-size:17px;margin-bottom:14px}
button{width:100%;padding:15px;border:0;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.result{display:none;margin-top:25px;padding:25px;border-radius:16px;background:#f0f2f5}
.phrase{font-size:30px;font-weight:800;margin:10px 0}
.small{font-size:13px;color:#68727d;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<h1>🎲 Team Phrase Challenge</h1>
<div class="sub">Enter your name, then reveal your phrase for the week.</div>
<input id="name" placeholder="Your name" autocomplete="name">
<button id="go">Reveal My Phrase</button>
<div id="result" class="result">
<div>Your phrase is:</div>
<div id="phrase" class="phrase"></div>
<div id="thanks"></div>
</div>
<div class="small">Each phrase can only be allocated once.</div>
</div>

<script>
const nameEl=document.getElementById("name");
const go=document.getElementById("go");

go.onclick=async()=>{
 const name=nameEl.value.trim();
 if(!name){
   alert("Please enter your name.");
   return;
 }
 go.disabled=true;
 try{
   const r=await fetch("/api/reveal",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({name})
   });
   const d=await r.json();
   if(!r.ok) throw new Error(d.error||"Something went wrong.");
   document.getElementById("phrase").textContent=d.phrase;
   document.getElementById("thanks").textContent=`Thanks, ${d.name}!`;
   document.getElementById("result").style.display="block";
 }catch(e){
   alert(e.message);
   go.disabled=false;
 }
};
</script>
</body>
</html>
